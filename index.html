<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthlight</title>
<style>
:root{
  --bg:#0b0713; --panel:#160e22; --panel2:#21142f; --panel3:#2c1b3f; --border:#4a2f66; --border2:#6d4790;
  --gold:#f0b752; --gold2:#a8762a; --teal:#46d6c8; --teal2:#1f8d86; --text:#eadfcf; --dim:#9c8bb0; --dim2:#6b5c80;
  --red:#e2483c; --green:#68d36a; --blue:#4fa4ff; --purple:#c56cff; --orange:#ff9a3c;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--text);font-family:var(--sans);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;background:#000}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
.hidden{display:none!important}
canvas.icon{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud-tl{position:absolute;left:14px;top:12px;width:300px}
.pname{font-family:var(--serif);font-size:17px;color:var(--gold);text-shadow:0 2px 0 #000;letter-spacing:.5px}
.pname small{color:var(--dim);font-family:var(--sans);font-size:12px;margin-left:6px}
.bar{position:relative;height:14px;margin-top:4px;background:#0c0714;border:2px solid #000;box-shadow:0 0 0 1px var(--border) inset,0 2px 0 rgba(0,0,0,.5)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;transition:width .08s linear}
.bar .lag{position:absolute;left:0;top:0;bottom:0;background:#fff3;transition:width .5s ease-out .25s}
.bar .txt{position:absolute;inset:0;font-size:10px;line-height:10px;text-align:center;font-weight:700;text-shadow:0 1px 1px #000,0 0 2px #000;color:#fff}
.bar.hp{height:18px}.bar.hp .fill{background:linear-gradient(#ff6a5c,#c22b2b 60%,#8e1b22)}
.bar.hp .txt{line-height:14px;font-size:11px}
.bar.hp .shield{position:absolute;top:0;bottom:0;background:linear-gradient(#bff7ff,#59c8e8);opacity:.8}
.bar.sta .fill{background:linear-gradient(#ffe27a,#d8a32b)}
.bar.sta.exhausted .fill{background:linear-gradient(#a27a5a,#6e4a33)}
.bar.mana .fill{background:linear-gradient(#7fc6ff,#3368d6)}
.hudrow{display:flex;gap:12px;margin-top:6px;font-size:13px;text-shadow:0 1px 0 #000;align-items:center}
.hudrow span b{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px}
#party{position:absolute;left:14px;top:132px;width:190px}
.pm{margin-bottom:8px;font-size:12px}
.pm .nm{display:flex;justify-content:space-between;text-shadow:0 1px 0 #000}
.pm .bar{height:8px;margin-top:2px}
.pm.down .nm{color:var(--red)}
.pm.off{opacity:.45}
#minimap-wrap{position:absolute;right:14px;top:12px;text-align:right}
#minimap{width:180px;height:130px;background:rgba(10,6,18,.75);border:2px solid #000;box-shadow:0 0 0 1px var(--border) inset;image-rendering:pixelated}
#area-name{font-family:var(--serif);color:var(--dim);font-size:13px;margin-top:3px;text-shadow:0 1px 0 #000}
#netstatus{position:absolute;right:14px;top:172px;font-size:12px;color:var(--teal);text-align:right;text-shadow:0 1px 0 #000}
#bossbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(640px,70vw);text-align:center}
#bossbar .bname{font-family:var(--serif);font-size:20px;color:#f3d6a6;text-shadow:0 2px 0 #000,0 0 12px #000;letter-spacing:1px}
#bossbar .bsub{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:3px}
#bossbar .bbar{position:relative;height:14px;background:#0c0714;border:2px solid #000;box-shadow:0 0 0 1px #6b3a2a inset}
#bossbar .bfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff7b4a,#b8261c 60%,#6e1010);transition:width .1s}
#bossbar .bdelay{position:absolute;left:0;top:0;bottom:0;background:#f5d27a88;transition:width .6s ease-out .3s}
#bossbar .bmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#f0b752}
#hotbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end}
.slot{position:relative;width:52px;height:52px;background:rgba(15,9,24,.85);border:2px solid #000;box-shadow:0 0 0 1px var(--border) inset}
.slot canvas{position:absolute;left:0;top:0;width:48px;height:48px;image-rendering:pixelated}
.slot .key{position:absolute;left:2px;top:0;font-size:10px;font-weight:700;color:var(--gold);text-shadow:0 1px 0 #000}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);}
.slot .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;text-shadow:0 1px 2px #000}
.slot.nomana canvas{filter:grayscale(.8) brightness(.6)}
.slot .mc{position:absolute;right:2px;bottom:0;font-size:10px;color:#8fc8ff;text-shadow:0 1px 0 #000;font-weight:700}
.slot.flash{box-shadow:0 0 0 2px var(--gold) inset,0 0 14px var(--gold)}
.slot.empty{opacity:.35}
.slot.potion{margin-left:10px}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:13px;font-weight:800;text-shadow:0 1px 0 #000}
#xpbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(440px,60vw);height:5px;background:#0c0714;border:1px solid #000}
#xpfill{height:100%;background:linear-gradient(90deg,#8e5bd8,#c99cff)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:14px;background:rgba(12,7,20,.85);border:1px solid var(--border);padding:5px 12px;border-radius:3px;white-space:nowrap}
#prompt b{color:var(--gold);border:1px solid var(--gold2);padding:0 5px;border-radius:2px;margin-right:6px;font-size:12px}
#toasts{position:absolute;left:50%;top:78px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:linear-gradient(#251538,#170d23);border:1px solid var(--border2);padding:7px 16px;font-size:14px;box-shadow:0 4px 18px #000a;animation:tin .25s ease-out;text-align:center}
.toast.ach{border-color:var(--gold)}.toast.ach .tt{color:var(--gold);font-family:var(--serif);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#pickups{position:absolute;right:14px;bottom:110px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pick{font-size:13px;background:rgba(12,7,20,.75);padding:3px 10px;border-right:3px solid #888;text-shadow:0 1px 0 #000;animation:tin .2s}
#chatlog{position:absolute;left:14px;bottom:96px;width:340px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.cl{background:rgba(10,6,16,.6);padding:2px 7px;text-shadow:0 1px 0 #000;transition:opacity 1s}
.cl.sys{color:var(--teal)}
.cl.old{opacity:0}
#chatin{position:absolute;left:14px;bottom:70px;width:340px;pointer-events:auto;background:rgba(10,6,16,.92);border:1px solid var(--border2);color:var(--text);padding:5px 8px;font-size:13px;outline:none}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner .b1{font-family:var(--serif);font-size:44px;color:#f6e3c0;text-shadow:0 3px 0 #000,0 0 30px rgba(255,150,60,.35);letter-spacing:3px}
#banner .b2{font-size:15px;color:var(--dim);letter-spacing:5px;text-transform:uppercase;margin-top:6px;text-shadow:0 2px 0 #000}
#banner.death .b1{color:#c9302a;font-size:58px;text-shadow:0 3px 0 #000,0 0 40px #600}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#keyhelp{position:absolute;right:14px;bottom:30px;font-size:11px;color:var(--dim);text-align:right;line-height:1.5;text-shadow:0 1px 0 #000}
#keyhelp b{color:var(--text)}

/* ---------- Menus ---------- */
#menu-root{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(5,2,10,.55)}
.screen.clear{background:transparent}
.panel{background:linear-gradient(var(--panel2),var(--panel));border:2px solid #000;box-shadow:0 0 0 1px var(--border2) inset,0 0 0 3px #000,0 20px 60px #000c;padding:18px 22px;max-height:92vh;overflow:auto;min-width:320px;position:relative}
.panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:var(--border)}
.panel h2{font-family:var(--serif);font-weight:normal;color:var(--gold);margin:0 0 4px;font-size:26px;letter-spacing:1px}
.panel h3{font-family:var(--serif);font-weight:normal;color:var(--gold);margin:12px 0 6px;font-size:17px}
.panel .sub{color:var(--dim);font-size:13px;margin-bottom:12px}
.panel .close{position:absolute;right:10px;top:8px}
.btn{pointer-events:auto;display:inline-block;background:linear-gradient(#3a2554,#26173a);color:var(--text);border:1px solid #000;box-shadow:0 0 0 1px var(--border2) inset;padding:8px 16px;font-size:14px;cursor:pointer;font-family:var(--sans);margin:3px;min-width:44px;text-align:center}
.btn:hover{background:linear-gradient(#4b3170,#2f1d48);box-shadow:0 0 0 1px var(--gold) inset;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#a0662a,#6b3f18);box-shadow:0 0 0 1px var(--gold) inset}
.btn.primary:hover{background:linear-gradient(#bd7a34,#7e4b1d)}
.btn.danger{background:linear-gradient(#6b2121,#431212)}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled],.btn.disabled{opacity:.4;pointer-events:none}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:7px 13px;cursor:pointer;color:var(--dim);font-size:14px;border:1px solid transparent;border-bottom:none}
.tab:hover{color:var(--text)}
.tab.on{color:var(--gold);background:var(--panel3);border-color:var(--border)}
input[type=text]{background:#0d0816;border:1px solid var(--border2);color:var(--text);padding:8px 10px;font-size:15px;outline:none}
input[type=text]:focus{border-color:var(--gold)}
input[type=range]{width:180px;accent-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:5px}
.cell{position:relative;width:52px;height:52px;background:#0e0818;border:1px solid #000;box-shadow:0 0 0 1px var(--border) inset;cursor:pointer}
.cell:hover{box-shadow:0 0 0 1px var(--gold) inset}
.cell canvas{position:absolute;left:1px;top:1px;width:48px;height:48px;image-rendering:pixelated}
.cell .up{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 1px 0 #000}
.cell .better{position:absolute;right:2px;top:0;font-size:11px;color:#6ee070;text-shadow:0 1px 0 #000;font-weight:800}
.cell .ub{position:absolute;left:2px;top:0;font-size:9px;color:var(--orange);font-weight:800}
.cell.sel{box-shadow:0 0 0 2px var(--teal) inset}
.r-common{border-color:#777!important}.r-uncommon{box-shadow:0 0 0 1px #3c9c3e inset!important}.r-rare{box-shadow:0 0 0 1px #3a7ed0 inset!important}.r-epic{box-shadow:0 0 0 1px #9a4bd8 inset,0 0 8px #9a4bd855!important}
.c-common{color:#d0d0d0}.c-uncommon{color:#6ee070}.c-rare{color:#5aaeff}.c-epic{color:#d48aff}
#tooltip{position:absolute;pointer-events:none;z-index:50;background:linear-gradient(#1f1330,#120a1c);border:1px solid #000;box-shadow:0 0 0 1px var(--border2) inset,0 8px 30px #000;padding:10px 12px;font-size:13px;max-width:300px;min-width:200px}
#tooltip .tn{font-family:var(--serif);font-size:16px}
#tooltip .tk{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#tooltip .st{display:flex;justify-content:space-between;gap:12px}
#tooltip .af{color:#a9c8ff}
#tooltip .up{color:#6ee070}#tooltip .dn{color:#ff6b5e}
#tooltip .hint{color:var(--dim);font-size:11px;margin-top:6px;border-top:1px solid var(--border);padding-top:5px}
.eqslot{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.eqslot .lbl{width:64px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.statrow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.statrow b{color:var(--gold)}
.card{position:relative;width:124px;height:186px;overflow:hidden;background:linear-gradient(#2a1a3d,#160d22);border:1px solid #000;box-shadow:0 0 0 1px var(--border2) inset;padding:6px;cursor:pointer;text-align:center;font-size:11px}
.card:hover{box-shadow:0 0 0 1px var(--gold) inset,0 0 14px #f0b75244}
.card canvas{width:72px;height:72px;image-rendering:pixelated;margin:4px auto;display:block}
.card .cn{font-family:var(--serif);font-size:14px;color:var(--text)}
.card .cm{color:#8fc8ff;font-size:11px}
.card .cdsc{color:var(--dim);font-size:10px;line-height:1.25;margin-top:3px}
.card.in{box-shadow:0 0 0 2px var(--teal) inset}
.card.locked{opacity:.35;filter:grayscale(1)}
.card .ck{position:absolute;left:5px;top:3px;color:var(--gold);font-weight:800}
.npc-talk{font-family:var(--serif);font-style:italic;color:#d9c7a6;font-size:15px;margin:-2px 0 14px;max-width:560px;line-height:1.4}
.list .li{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:1px solid #ffffff10}
.list .li:hover{background:#ffffff08}
.price{color:var(--gold);font-weight:700;min-width:70px;text-align:right}
.mat{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:13px}
.mat i{display:inline-block;width:10px;height:10px;border:1px solid #000}
.quest{border:1px solid var(--border);padding:8px 10px;margin-bottom:6px;background:#0f0918}
.quest .qt{font-family:var(--serif);color:var(--text);font-size:15px}
.quest .qd{color:var(--dim);font-size:12px}
.quest .qr{color:var(--gold);font-size:12px}
.quest.done{border-color:var(--gold)}
.prog{height:6px;background:#000;margin-top:4px}.prog i{display:block;height:100%;background:var(--teal)}
.ach{display:flex;gap:10px;padding:6px;border-bottom:1px solid #ffffff10;align-items:center}
.ach.no{opacity:.4}
.ach .ai{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#0e0818;border:1px solid var(--gold2);color:var(--gold);font-weight:800}
.kbd{display:inline-block;border:1px solid var(--border2);background:#0e0818;padding:0 5px;font-size:11px;border-radius:2px;color:var(--gold);min-width:16px;text-align:center}
/* title */
#title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:max(40px,7vw);pointer-events:auto;background:linear-gradient(90deg,rgba(5,2,10,.88) 0%,rgba(5,2,10,.55) 38%,transparent 62%),radial-gradient(ellipse at 70% 55%,transparent 30%,rgba(0,0,0,.6))}
.logo{font-family:var(--serif);font-size:min(92px,12vw);color:#f7e2bb;letter-spacing:6px;text-shadow:0 4px 0 #3b1a0b,0 0 40px rgba(255,140,50,.5),0 0 90px rgba(255,120,40,.25);line-height:1}
.logo-sub{color:#c7b4dc;letter-spacing:8px;text-transform:uppercase;font-size:13px;margin:10px 0 30px 4px;text-shadow:0 2px 0 #000}
.tmenu{display:flex;flex-direction:column;gap:4px;width:280px}
.tmenu .btn{font-size:16px;padding:11px;font-family:var(--serif);letter-spacing:1px}
.foot{position:absolute;bottom:12px;color:var(--dim2);font-size:11px;text-align:center;width:100%}
.slotcard{border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;background:#0f0918;display:flex;justify-content:space-between;align-items:center;gap:14px;min-width:460px}
.slotcard .sn{font-family:var(--serif);font-size:18px;color:var(--gold)}
.slotcard .si{color:var(--dim);font-size:12px}
.colors{display:flex;gap:6px}
.colors div{width:26px;height:26px;border:2px solid #000;cursor:pointer;box-shadow:0 0 0 1px #fff3 inset}
.colors div.on{outline:2px solid var(--gold)}
.note{font-size:12px;color:var(--dim)}
.err{color:var(--red);font-size:13px;min-height:18px}
.code{font-family:Consolas,monospace;font-size:34px;letter-spacing:8px;color:var(--teal);text-shadow:0 0 18px #46d6c855}
.dun{display:flex;gap:12px;align-items:center;border:1px solid var(--border);padding:10px;margin-bottom:8px;background:#0f0918;cursor:pointer;min-width:520px}
.dun:hover{border-color:var(--gold)}
.dun.lock{opacity:.4;pointer-events:none}
.dun .dn{font-family:var(--serif);font-size:19px}
.dun .dd{color:var(--dim);font-size:12px}
.dun .sw{width:58px;height:58px;border:1px solid #000;flex:none}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--border2);margin-left:6px;color:var(--dim)}
.pill.ok{color:var(--gold);border-color:var(--gold2)}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-tl">
      <div class="pname"><span id="h-name">Hero</span><small id="h-lvl">Lv 1</small></div>
      <div class="bar hp"><div class="lag" id="h-hplag"></div><div class="fill" id="h-hp"></div><div class="shield" id="h-shield"></div><div class="txt" id="h-hpt"></div></div>
      <div class="bar sta" id="h-stabar"><div class="fill" id="h-sta"></div></div>
      <div class="bar mana"><div class="fill" id="h-mana"></div><div class="txt" id="h-manat"></div></div>
      <div class="hudrow"><span class="chip" id="h-gold"></span><span class="chip" id="h-keys"></span><span class="chip" id="h-pts"></span></div>
    </div>
    <div id="party"></div>
    <div id="minimap-wrap"><canvas id="minimap" width="180" height="130"></canvas><div id="area-name"></div></div>
    <div id="netstatus"></div>
    <div id="bossbar" class="hidden"><div class="bsub" id="b-sub"></div><div class="bname" id="b-name"></div><div class="bbar"><div class="bdelay" id="b-delay"></div><div class="bfill" id="b-fill"></div><div class="bmark" id="b-m1"></div><div class="bmark" id="b-m2"></div></div></div>
    <div id="hotbar"></div>
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="toasts"></div>
    <div id="pickups"></div>
    <div id="chatlog"></div>
    <div id="keyhelp"></div>
    <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  </div>
  <input id="chatin" class="hidden" maxlength="120" placeholder="Say something... (Enter to send, Esc to cancel)">
  <div id="menu-root"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="fade"></div>
</div>
<script>
// ---- 01_util.js ----
'use strict';
// ============================================================================
//  HEARTHLIGHT — core utilities
// ============================================================================
const TS = 16;            // tile size in world pixels
const TICK = 1 / 60;      // fixed simulation timestep
const TAU = Math.PI * 2;
const INK = '#140c1c';    // outline / darkest colour

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function lerpAng(a, b, t) { return a + angDiff(a, b) * t; }
function rotToward(a, b, maxStep) { const d = angDiff(a, b); return a + clamp(d, -maxStep, maxStep); }
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const nowSec = () => performance.now() / 1000;
const r1 = v => Math.round(v * 10) / 10;
const fmt = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n));

function mulberry32(a) {
  return function () {

function rollRarity(rng, luck = 0, minR = 'common') {
  const r = rng();
  let k = r < 0.03 + luck * 0.6 ? 'epic' : r < 0.14 + luck ? 'rare' : r < 0.42 + luck ? 'uncommon' : 'common';
  if (RARITY[k].i < RARITY[minR].i) k = minR;
  return k;
}
// Generate a random item. opts: {slot, rarity, minRarity, luck, rng}
function genItem(ilvl, opts = {}) {
  const rng = opts.rng || Math.random;
  const R = a => a[Math.floor(rng() * a.length)];
  const slot = opts.slot || (rng() < 0.45 ? 'weapon' : rng() < 0.55 ? 'armor' : 'trinket');
  const rarity = opts.rarity || rollRarity(rng, opts.luck || 0, opts.minRarity);
  const rr = RARITY[rarity];
  const tierIdx = clamp(Math.floor(ilvl / 4), 0, 4);
  const it = { uid: uid(), slot, rarity, ilvl, upg: 0, affixes: [] };
  if (slot === 'weapon') {
    it.type = opts.type || R(Object.keys(WEAPONS));
    const W = WEAPONS[it.type];
    it.base = { atk: Math.round(W.dmg * (1 + ilvl * 0.13) * rr.mult * (0.92 + rng() * 0.16)) };
    it.baseName = W.names[clamp(tierIdx, 0, W.names.length - 1)];
  } else if (slot === 'armor') {
    it.type = opts.type || R(Object.keys(ARMORS));
    const A = ARMORS[it.type];
    const m = (1 + ilvl * 0.12) * rr.mult;
    it.base = { armor: Math.round(A.armor * m), hp: Math.round(A.hp * m) };
    if (A.mana) it.base.mana = Math.round(A.mana * m);
    if (A.speed) it.base.speed = Math.round(A.speed * 100);
    it.baseName = A.names[clamp(tierIdx, 0, A.names.length - 1)];
  } else {
    it.type = opts.type || R(Object.keys(TRINKETS));
    const T = TRINKETS[it.type];
    it.base = { [T.imp]: Math.round(T.impV * (1 + ilvl * 0.08) * rr.mult) };
    it.baseName = T.names[clamp(tierIdx, 0, T.names.length - 1)];
  }
  const pool = Object.keys(AFFIXES).filter(k => !(it.base[k]));
  for (let i = 0; i < rr.affixes && pool.length; i++) {
    const k = pool.splice(Math.floor(rng() * pool.length), 1)[0], A = AFFIXES[k];
    const v = Math.max(1, Math.round(A.min + (A.max - A.min) * rng() + A.per * ilvl));
    it.affixes.push({ k, v });
  }
  if (rarity === 'epic') it.name = R(EPIC_NAMES);
  else if (it.affixes.length === 1) it.name = AFFIXES[it.affixes[0].k].pre + ' ' + it.baseName;
  else if (it.affixes.length === 2) it.name = AFFIXES[it.affixes[0].k].pre + ' ' + it.baseName + ' ' + AFFIXES[it.affixes[1].k].suf;
  else it.name = it.baseName;
  return it;
}
// total stats an item grants (upgrade level boosts base stats 10% per level)
function itemStats(it) {
  const s = {}, um = 1 + (it.upg || 0) * 0.1;
  for (const k in it.base) s[k] = (s[k] || 0) + (k === 'speed' ? it.base[k] : Math.round(it.base[k] * um));
  for (const a of it.affixes) s[a.k] = (s[a.k] || 0) + a.v;
  return s;
}
const STAT_LABEL = {
  atk: 'Attack', dmg: 'Damage %', armor: 'Armor', hp: 'Health', mana: 'Mana', speed: 'Move Speed %', crit: 'Crit %', sta: 'Stamina',
  staRegen: 'Stamina Regen %', critDmg: 'Crit Damage %', cdr: 'Cooldown %', leech: 'Life Steal %', magic: 'Spell Damage %',
};
const POWER_W = { atk: 3, armor: 1.5, hp: 0.5, mana: 0.4, dmg: 2, crit: 3, critDmg: 0.8, sta: 0.6, staRegen: 0.8, cdr: 2.5, speed: 3, leech: 6, magic: 1.6 };
function itemPower(it) { const s = itemStats(it); let p = 0; for (const k in s) p += (POWER_W[k] || 0) * s[k]; return p; }
function itemDisplayName(it) { return (it.upg ? `+${it.upg} ` : '') + it.name; }
function itemKind(it) {
  if (it.slot === 'weapon') return `${RARITY[it.rarity].name} ${WEAPONS[it.type].name}`;
  if (it.slot === 'armor') return `${RARITY[it.rarity].name} ${ARMORS[it.type].name} Armor`;
  return `${RARITY[it.rarity].name} ${TRINKETS[it.type].name}`;
}
function itemValue(it) { return Math.round((8 + it.ilvl * 4) * RARITY[it.rarity].value * (1 + (it.upg || 0) * 0.3)); }
const MAX_UPG = 10;
function upgradeCost(it) {
  const u = it.upg || 0, r = RARITY[it.rarity].i;
  const c = { gold: Math.round((30 + it.ilvl * 6) * (1 + u * 0.6) * (1 + r * 0.25)), iron: 2 + u * 2 };
  const special = u >= 3 ? (it.ilvl < 6 ? 'bone' : it.ilvl < 11 ? 'wood' : 'pearl') : null;
  if (special) c[special] = u - 1;
  if (u >= 7) c.ember = u - 5;
  return c;
}
function salvageYield(it) { const r = RARITY[it.rarity].i; const y = { iron: 1 + r + Math.floor(it.ilvl / 5) }; if (r >= 2) y.ember = r - 1; return y; }

// ============================================================================
//  Procedural pixel-art sprites. Everything is painted with rects at load
//  time, then crisped and auto-outlined so it reads as hand-made pixel art.
// ============================================================================
const SPR = {};
const ICONS = {};

function crispOutline(c, col = INK) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const d = x.getImageData(0, 0, w, h), a = d.data;
  const solid = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) { if (a[i * 4 + 3] >= 110) { solid[i] = 1; a[i * 4 + 3] = 255; } else a[i * 4 + 3] = 0; }
  const [r, g, b] = hexRgb(col);
  if (col) for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
    const i = y * w + X; if (solid[i]) continue;
    if ((X > 0 && solid[i - 1]) || (X < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])) {
      a[i * 4] = r; a[i * 4 + 1] = g; a[i * 4 + 2] = b; a[i * 4 + 3] = 255;
    }
  }
  x.putImageData(d, 0, 0);
}
// The "polish" pass every sprite goes through:
//  - crisp alpha, top-left key light: rim highlights on top/left edges, shade on bottom/right
//  - contact shadow where one part overlaps another (under heads, belts, arms)
//  - selective outline: each outline pixel is a deep shade of the colour it borders
//    (pure ink only along the bottom, which grounds the sprite)
function polishSprite(c, opt = {}) {
  const x = c.getContext('2d'), w = c.width, h = c.height;

  const S = (X, Y) => X >= 0 && Y >= 0 && X < w && Y < h && solid[Y * w + X];
  const lum = (i) => src[i * 4] * 0.3 + src[i * 4 + 1] * 0.55 + src[i * 4 + 2] * 0.15;
  const same = (i, j) => Math.abs(src[i * 4] - src[j * 4]) + Math.abs(src[i * 4 + 1] - src[j * 4 + 1]) + Math.abs(src[i * 4 + 2] - src[j * 4 + 2]) < 24;
  const set = (i, f) => { for (let k = 0; k < 3; k++) { const v = src[i * 4 + k]; a[i * 4 + k] = f >= 1 ? v + (255 - v) * (f - 1) : v * f; } };
  const shadeOn = opt.shade !== false;
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    const i = Y * w + X;
    if (!solid[i]) { a[i * 4 + 3] = 0; continue; }
    a[i * 4 + 3] = 255;
    if (!shadeOn) continue;
    const L = lum(i); if (L < 28 || L > 238) continue; // keep inks, eyes and glints crisp
    const up = Y > 0 ? i - w : -1, dn = Y < h - 1 ? i + w : -1, lf = X > 0 ? i - 1 : -1, rt = X < w - 1 ? i + 1 : -1;
    if (!S(X, Y - 1)) set(i, 1.22);
    else if (!S(X - 1, Y)) set(i, 1.1);
    else if (!S(X, Y + 1)) set(i, 0.7);
    else if (!S(X + 1, Y)) set(i, 0.8);
    else if (up >= 0 && !same(i, up) && lum(up) + 30 < L) set(i, 0.84);      // occlusion under a darker overlapping part
    else if (up >= 0 && !same(i, up) && lum(up) > L + 30 && opt.inner !== false) set(i, 1.08);
  }
  if (opt.outline !== false) {
    const ink = hexRgb(INK);
    for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
      const i = Y * w + X; if (solid[i]) continue;
      let n = -1;
      if (S(X, Y + 1)) n = i + w; else if (S(X - 1, Y)) n = i - 1; else if (S(X + 1, Y)) n = i + 1; else if (S(X, Y - 1)) n = i - w;
      if (n < 0) continue;
      const below = S(X, Y - 1) && !S(X, Y + 1) && n === i - w; // outline under the sprite
      for (let k = 0; k < 3; k++) a[i * 4 + k] = below ? ink[k] : Math.round(src[n * 4 + k] * 0.22 + ink[k] * 0.62);
      a[i * 4 + 3] = 255;
    }
  }
  x.putImageData(d, 0, 0);
}
function silhouette(c, col = '#ffffff') {
  const [s, x] = mkCanvas(c.width, c.height);
  x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return s;
}
// make a sprite with n frames; draw(P, frame, ctx) where P(x,y,w,h,col) paints a rect
function makeSpr(name, w, h, n, draw, opt = {}) {
  const s = { frames: [], white: [], red: [], w, h, ax: opt.ax ?? Math.floor(w / 2), ay: opt.ay ?? h - 2 };
  for (let f = 0; f < n; f++) {
    const [c, x] = mkCanvas(w, h);
    const P = (px, py, pw, ph, col) => { if (col === 'clear') { x.clearRect(px, py, pw, ph); return; } x.fillStyle = col; x.fillRect(px, py, pw, ph); };
    draw(P, f, x);
    if (opt.polish === false) { if (opt.outline !== false) crispOutline(c, opt.oc || INK); }
    else polishSprite(c, opt);
    s.frames.push(c); s.white.push(silhouette(c, '#fff')); s.red.push(silhouette(c, '#ff3a2a'));

}
function drawSpr(ctx, s, frame, x, y, flip = false, white = false, alpha = 1, sx = 1, sy = 1) {
  if (!s) return;
  const c = (white === 'red' ? s.red : white ? s.white : s.frames)[((frame | 0) % s.frames.length + s.frames.length) % s.frames.length];
  if (alpha !== 1) ctx.globalAlpha = alpha;
  if (!flip && sx === 1 && sy === 1) ctx.drawImage(c, Math.round(x - s.ax), Math.round(y - s.ay));
  else {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(flip ? -sx : sx, sy);
    ctx.drawImage(c, -s.ax, -s.ay); ctx.restore();
  }
  if (alpha !== 1) ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
//  Humanoid generator (24x32). frames: 0-3 walk cycle (0 = idle), 4 = back view,
//  5 = strike pose, 6 = hurt pose. o = palette / costume options.
//  Every frame then goes through polishSprite() for lighting + outlines.

    const c1 = shade(o.cape, 0.72), c2 = shade(o.cape, 0.55);
    Q(6, 11, 12, 13, c1); Q(5 + sway, 22, 14, 4, c1); Q(5 + sway, 25, 14, 1, c2);
    Q(6, 13, 1, 11, c2); Q(17, 13, 1, 11, c2);

    Q(7, 18, 10, 4, rb); Q(6, 22, 12, 4, rb); Q(5 + (sway > 0 ? 1 : 0), 26, 14, 3, rb);
    Q(11, 18, 2, 11, shade(rb, 0.8)); Q(16, 20, 2, 8, shade(rb, 0.75));
    Q(5 + (sway > 0 ? 1 : 0), 28, 14, 1, trim);

    for (let i = 0; i < 4; i++) { Q(8, 12 + i * 2, 3, 1, skin); Q(13, 12 + i * 2, 3, 1, skin); }
    Q(8, 19, 8, 2, shade(skin, 0.88)); Q(9, 18, 6, 1, shade(skin, 0.7));
    if (o.body) { Q(8, 20, 8, 3, o.body); Q(8, 23, 2, 1, o.body); Q(11, 23, 2, 2, o.body); Q(14, 23, 2, 1, o.body); Q(8, 20, 8, 1, shade(o.body, 0.7)); }
  } else if (o.robe) {
    const rb = o.robeC || body;

    if (o.chest) { Q(10, 14, 4, 3, o.chest); Q(11, 15, 2, 1, shade(o.chest, 0.6)); }

const ICONS_S = {};
function icon(key, draw) { const s = makeSpr(null, 16, 16, 1, (P) => draw(P), { ax: 8, ay: 8 }); ICONS_S[key] = s.frames[0]; return s.frames[0]; }
function iconHD(key, draw) {
  const s = makeSpr(null, 24, 24, 1, (P, f, x) => {
    const L = (x0, y0, x1, y1, c, t = 1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) P(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), t, t, c); };
    const C = (cx, cy, r, c) => { for (let y = -r; y <= r; y++) for (let xx = -r; xx <= r; xx++) if (xx * xx + y * y <= r * r + r * 0.6) P(cx + xx, cy + y, 1, 1, c); };
    draw(P, L, C, x);
  }, { ax: 12, ay: 12 });
  ICONS[key] = s.frames[0]; return s.frames[0];
}

//  Maps: dungeon generation, village layout, collision, pre-rendering

const T = { VOID: 0, FLOOR: 1, WALL: 2, DOOR: 3, PILLAR: 4, WATER: 5, SPIKE: 6, DEEP: 7, GRASS: 8, PATH: 9, COBBLE: 10, TREE: 11, BLDG: 12, SOLID: 13 };
const SOLID_T = new Uint8Array(16); [T.VOID, T.WALL, T.PILLAR, T.DEEP, T.TREE, T.BLDG, T.SOLID].forEach(t => SOLID_T[t] = 1);
const PROJ_SOLID_T = new Uint8Array(16); [T.VOID, T.WALL, T.PILLAR, T.TREE, T.BLDG].forEach(t => PROJ_SOLID_T[t] = 1);
const FLOORISH = t => t === T.FLOOR || t === T.DOOR || t === T.WATER || t === T.SPIKE || t === T.DEEP || t >= T.GRASS && t <= T.COBBLE;

function tileAt(map, tx, ty) { return (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) ? T.VOID : map.t[ty * map.w + tx]; }
function doorClosedAt(map, tx, ty) {
  const di = map.doorAt[ty * map.w + tx]; if (!di) return false;
  return !map.doors[di - 1].open;
}
function solidTile(map, tx, ty) {
  const t = tileAt(map, tx, ty);
  if (SOLID_T[t]) return true;
  if (t === T.DOOR) return doorClosedAt(map, tx, ty);
  return false;
}
function projSolidTile(map, tx, ty) {
  const t = tileAt(map, tx, ty);
  if (PROJ_SOLID_T[t]) return true;
  if (t === T.DOOR) return doorClosedAt(map, tx, ty);
  return false;
}
function solidAt(map, x, y) { return solidTile(map, Math.floor(x / TS), Math.floor(y / TS)); }
function projSolidAt(map, x, y) { return projSolidTile(map, Math.floor(x / TS), Math.floor(y / TS)); }

// push a circle out of solid tiles
function collideCircle(map, e, r) {
  const x0 = Math.floor((e.x - r) / TS), x1 = Math.floor((e.x + r) / TS), y0 = Math.floor((e.y - r) / TS), y1 = Math.floor((e.y + r) / TS);
  let hit = false;
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!solidTile(map, tx, ty)) continue;
    const rx = tx * TS, ry = ty * TS;
    const cx = clamp(e.x, rx, rx + TS), cy = clamp(e.y, ry, ry + TS);
    let dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    hit = true;
    if (d2 > 0.0001) { const d = Math.sqrt(d2); e.x += dx / d * (r - d); e.y += dy / d * (r - d); }
    else { // centre inside the tile: push out along the shallowest axis
      const l = e.x - rx, rr = rx + TS - e.x, u = e.y - ry, b = ry + TS - e.y, m = Math.min(l, rr, u, b);
      if (m === l) e.x = rx - r; else if (m === rr) e.x = rx + TS + r; else if (m === u) e.y = ry - r; else e.y = ry + TS + r;
    }
  }
  return hit;
}
function moveEntity(map, e, dx, dy, r) {
  let hit = false;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (r * 0.8)));
  for (let i = 0; i < steps; i++) {
    e.x += dx / steps; if (collideCircle(map, e, r)) hit = true;
    e.y += dy / steps; if (collideCircle(map, e, r)) hit = true;
  }
  return hit;
}
// line of sight on the tile grid (for AI + projectiles)
function lineOfSight(map, x0, y0, x1, y1, proj = true) {
  const d = dist(x0, y0, x1, y1), n = Math.ceil(d / 6);
  for (let i = 1; i < n; i++) {
    const x = lerp(x0, x1, i / n), y = lerp(y0, y1, i / n);
    if (proj ? projSolidAt(map, x, y) : solidAt(map, x, y)) return false;
  }

}
function roomIndexAt(map, x, y) {
  if (!map.roomAt) return -1;
  const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return -1;
  return map.roomAt[ty * map.w + tx] - 1;
}

// ---------------------------------------------------------------------------
//  Dungeon generation (deterministic from seed so every client builds the
//  identical map; only the host spawns enemies into it)
// ---------------------------------------------------------------------------
function genDungeon(did, tier, seed) {
  const D = DUNGEONS[did], rng = new RNG(seed);
  const GW = 5, GH = 5, CW = 30, CH = 22, W = GW * CW, H = GH * CH;
  const t = new Uint8Array(W * H).fill(T.WALL);
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) t[y * W + x] = v; };
  const get = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? T.VOID : t[y * W + x];

  // --- room graph (random tree grown from the start cell) ---
  const grid = new Map(), cells = [];
  const addCell = (cx, cy, parent) => { const c = { cx, cy, nb: [], i: cells.length }; cells.push(c); grid.set(cx + ',' + cy, c); if (parent) { parent.nb.push(c); c.nb.push(parent); } return c; };
  const start = addCell(rng.int(1, 3), GH - 1);
  const target = 9 + Math.min(tier, 2) + rng.int(0, 1);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let guard = 0;
  while (cells.length < target && guard++ < 2000) {
    const base = rng.chance(0.55) ? cells[Math.max(0, cells.length - 1 - rng.int(0, 2))] : rng.pick(cells);
    const [dx, dy] = rng.pick(dirs), nx = base.cx + dx, ny = base.cy + dy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || grid.has(nx + ',' + ny)) continue;
    if (base.nb.length >= 3) continue;
    addCell(nx, ny, base);
  }

  const depth = new Map([[start, 0]]), q = [start];
  while (q.length) { const c = q.shift(); for (const n of c.nb) if (!depth.has(n)) { depth.set(n, depth.get(c) + 1); q.push(n); } }
  let leaves = cells.filter(c => c !== start && c.nb.length === 1).sort((a, b) => depth.get(b) - depth.get(a));
  const ensureLeaf = (avoid) => { // add a fresh leaf somewhere
    for (const c of rng.shuffle(cells.slice())) {
      if (avoid.includes(c)) continue;
      for (const [dx, dy] of rng.shuffle(dirs.slice())) {
        const nx = c.cx + dx, ny = c.cy + dy;
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH || grid.has(nx + ',' + ny)) continue;
        const n = addCell(nx, ny, c); depth.set(n, depth.get(c) + 1); return n;
      }
    }
    return null;
  };
  const boss = leaves[0] || ensureLeaf([start]);
  leaves = leaves.filter(c => c !== boss);
  const treasure = leaves[0] || ensureLeaf([start, boss]);
  const middle = cells.filter(c => c !== start && c !== boss && c !== treasure).sort((a, b) => depth.get(b) - depth.get(a));
  const elite = middle[0];
  const rest = middle.slice(1);
  rng.shuffle(rest);
  const keyRoom = rest[0] || elite;
  const trapCount = rest.length > 4 ? 2 : rest.length > 2 ? 1 : 0;
  for (const c of cells) c.type = 'combat';
  start.type = 'start'; boss.type = 'boss'; treasure.type = 'treasure'; if (elite) elite.type = 'elite';
  for (let i = 1; i <= trapCount; i++) if (rest[i]) rest[i].type = 'trap';

  // --- carve rooms ---
  const rooms = cells.map((c, i) => {
    let w, h;
    if (c.type === 'boss') { w = 26; h = 17; }
    else if (c.type === 'start') { w = 15; h = 11; }
    else if (c.type === 'treasure') { w = 13; h = 9; }
    else if (c.type === 'elite') { w = rng.int(21, 24); h = rng.int(13, 15); }
    else { w = rng.int(15, 23); h = rng.int(10, 14); }
    const x0 = c.cx * CW + Math.floor((CW - w) / 2) + rng.int(-1, 1);
    const y0 = c.cy * CH + Math.floor((CH - h) / 2) + 1 + rng.int(-1, 0);
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(x, y, T.FLOOR);
    // chamfered corners give rooms more interesting silhouettes
    const ch = c.type === 'boss' ? 3 : c.type === 'start' || c.type === 'treasure' ? 0 : rng.int(0, 3);
    if (ch >= 2) for (const [cx, cy, sx, sy] of [[x0, y0, 1, 1], [x0 + w - 1, y0, -1, 1], [x0, y0 + h - 1, 1, -1], [x0 + w - 1, y0 + h - 1, -1, -1]])

// player projectiles (fireball, ice lance, knives). Remote ones are visual only.

    if (pr.kind === 'fireball' && Math.random() < 0.8) G.fx.parts.push(part(pr.x, pr.y, rnd(-20, 20), rnd(-30, 0), pick(['#ff8a3a', '#ffd76a', '#ff5a2a']), 0.35, rnd(1, 3), true));

// ---------------------------------------------------------------------------
//  Damage application on the host
// ---------------------------------------------------------------------------
function applyHit(w, h) {
  const e = w.ents.get(h.id);

  if (e.kind === 'pot') return;

  if (e.kind === 'shield' && h.hv && Math.abs(angDiff(e.face, angTo(e.x, e.y, h.ax, h.ay))) < 1.15 && e.state !== 'stagger') {
    staggerEnemy(w, e.id, 1.1); Net.broadcast({ k: 'num', x: r1(e.x), y: r1(e.y - 26), v: 'GUARD BROKEN', c: '#ffe96a' });

}

}

function spawnCoin(w, x, y, val) {

// ---------------------------------------------------------------------------
//  Rooms, doors, waves, traps
// ---------------------------------------------------------------------------
function inRoomInterior(r, x, y) { return x > (r.x0) * TS + 2 && x < (r.x1 + 1) * TS - 2 && y > r.y0 * TS + 2 && y < (r.y1 + 1) * TS - 2; }
function updateRooms(w, dt) {
  const m = w.map;
  // locked doors open automatically when the party holds the right key
  for (const d of m.doors) {
    if (!d.lock) continue;
    const [tx, ty] = d.tiles[1], cx = tx * TS + 8, cy = ty * TS + 8;
    for (const p of playersIn(w)) {
      if (dist(p.x, p.y, cx, cy) > 26) continue;
      if (d.lock === 'key' && w.dun.keys > 0) { w.dun.keys--; d.lock = null; d.open = true; doorsChanged(w, 'unlock', d); Net.broadcast({ k: 'keys', keys: w.dun.keys, boss: w.dun.bossKey }); onKeys({ keys: w.dun.keys, boss: w.dun.bossKey, quiet: true }); }
      else if (d.lock === 'boss' && w.dun.bossKey) { d.lock = null; d.open = true; doorsChanged(w, 'unlock', d); }
      else if (!d._msgT || w.time - d._msgT > 3) { d._msgT = w.time; const msg = d.lock === 'boss' ? 'Sealed. The Boss Key is held by an elite champion.' : 'Locked. Find a key in another room.'; Net.broadcast({ k: 'toast', msg }); toast(msg); }
    }
  }
  for (const r of m.rooms) {
    if (r.cleared) continue;
    if (!r.active) {
      const inside = playersIn(w).filter(p => inRoomInterior(r, p.x, p.y) && dist(p.x, p.y, clamp(p.x, r.x0 * TS + 24, (r.x1 + 1) * TS - 24), clamp(p.y, r.y0 * TS + 24, (r.y1 + 1) * TS - 24)) < 1);
      if (inside.length) activateRoom(w, r, inside[0]);
      continue;
    }
    // active: waves
    const alive = [...w.ents.values()].some(e => e.type === 'enemy' && !e.dead && e.room === r.i && !e.minion) || [...w.ents.values()].some(e => e.boss && !e.dead && e.room === r.i);
    if (!alive && r.type !== 'boss') {

    const r = m.rooms[t.room]; if (!r.active || r.cleared) continue;
    const cyc = Math.floor((w.time + t.phase) / t.period);
    if (t.last !== cyc) { t.last = cyc; sfxAt('arrow', t.x, t.y, 0.6); spawnEProj(w, { kind: 'arrow', x: t.x, y: t.y, vx: Math.cos(t.ang) * 190, vy: Math.sin(t.ang) * 190, r: 3, dmg: Math.round(10 * (1 + scaleFor(w).lvl * 0.1) * TIERS[w.dun.tier].dmg), life: 3 }); }
  }
}
function activateRoom(w, r, who) {

  doorsChanged(w, 'close');
  // pull the rest of the party into the room so nobody is left outside the bars
  const entry = { x: clamp(who.x, r.x0 * TS + 28, (r.x1 + 1) * TS - 28), y: clamp(who.y, r.y0 * TS + 28, (r.y1 + 1) * TS - 28) };
  for (const p of w.players.values()) {
    if (p.away || inRoomInterior(r, p.x, p.y)) continue;
    const m = { k: 'tp', pid: p.pid, x: r1(entry.x + rnd(-8, 8)), y: r1(entry.y + rnd(-8, 8)) };
    if (p.pid === Net.pid) onTeleport(m); else Net.send(p.pid, m);
  }
  const ev = { k: 'room', i: r.i, s: 'active', type: r.type }; Net.broadcast(ev); onRoomEvent(ev);

}
function planWaves(w, r) {
  const D = DUNGEONS[w.dun.did], tier = w.dun.tier, party = Net.partySize();
  const area = r.w * r.h, waves = [];

    const pool = r.depth <= 1 && tier === 0 ? D.pool.filter(k => k !== 'caster' && k !== 'shield') : D.pool;

}
function spawnWave(w, r, kinds) {

    for (let tries = 0; tries < 40; tries++) {
      x = (rnd(r.x0 + 1, r.x1) + 0.5) * TS; y = (rnd(r.y0 + 1, r.y1) + 0.5) * TS;

  const ev = { k: 'chest', i, big: c.big ? 1 : 0, lvl: scaleFor(w).lvl, luck: scaleFor(w).luck, card: c.card ? 1 : 0, did: w.dun.did };
  Net.broadcast(ev); onChest(ev);
  if (c.key) spawnPickup(w, 'key', c.x, c.y + 10);
  for (let k = 0; k < (c.big ? 12 : 5); k++) spawnCoin(w, c.x, c.y + 6, Math.round(rnd(3, 7) * (1 + scaleFor(w).lvl * 0.15)));
}

// host: a player asked to interact with something
function hostInteract(w, m, pid) {
  if (m.what === 'chest') openChest(w, m.i, pid);
  if (m.what === 'portal') {
    if (w.leaving) return;
    if (m.kind === 'exit' && pid !== Net.pid && Net.role === 'host') { Net.send(pid, { k: 'toast', msg: 'Only the host can lead the party out early.' }); return; }
    w.leaving = true;
    const msg = { k: 'leaving', victory: m.kind === 'boss' ? 1 : 0 };
    Net.broadcast(msg); onLeaving(msg);

// ---- 08_net.js ----
// ============================================================================
//  Networking. Host-authoritative world + owner-predicted avatars.
//   - The host's browser runs enemies/bosses/rooms/loot (same code as solo).
//   - Every client simulates its OWN avatar instantly (client prediction) and
//     judges hits against itself; others are shown 100 ms in the past via
//     snapshot interpolation so they move smoothly.
//   - Guests report their hits to the host, which applies them authoritatively.
// ============================================================================
const INTERP = 0.1;      // render remote things this far in the past

const ONLINE_SERVER = 'wss://hearthlight.onrender.com';

const Net = {
  ws: null, role: 'solo', pid: 0, code: null, token: null, url: null, roster: [], online: false,
  sources: new Map(), // pid -> {off, buf:[]}
  snaps: [], hostOff: null, lastSnapT: 0, sendAcc: 0, psAcc: 0, reconnecting: false, rcTries: 0, pingMs: 0,
  isAuth() { return this.role !== 'guest'; },
  partySize() { return G.world ? Math.max(1, G.world.players.size) : 1; },
  defaultUrl() {

    if (/\.github\.io$/i.test(location.hostname)) return ONLINE_SERVER;

  status: null, // optional callback(text) for connection progress

      await new Promise(r => setTimeout(r, 2000));
    }
  },
  async connect(url) {
    await this.wake(url);

      const to = setTimeout(() => { try { ws.close(); } catch (e) { } rej(new Error('No server found at ' + url)); }, /^wss:/i.test(url) ? 15000 : 4000);
      ws.onopen = () => { clearTimeout(to); this.ws = ws; this.url = url; this.online = true; res(ws); };
      ws.onerror = () => { clearTimeout(to); rej(new Error('No server found at ' + url)); };

  },
  raw(obj) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(obj)); },
  send(to, d) { if (this.role === 'solo') return; this.raw({ t: 'msg', to, d }); },
  broadcast(d) { if (this.role === 'solo') return; this.raw({ t: 'msg', to: 'all', d }); },
  async host(name, url) {
    await this.connect(url);
    return new Promise((res, rej) => { this._pending = { res, rej }; this.raw({ t: 'host', name }); });
  },
  async join(code, name, url) {
    await this.connect(url);
    let token = null; try { const s = JSON.parse(sessionStorage.getItem('hl_join') || 'null'); if (s && s.code === code) token = s.token; } catch (e) { }
    return new Promise((res, rej) => { this._pending = { res, rej }; this.raw({ t: 'join', code, name, token }); });
  },
  leave() {
    this.reconnecting = false;
    if (this.ws) { try { this.raw({ t: 'leave' }); this.ws.close(); } catch (e) { } }
    this.ws = null; this.role = 'solo'; this.pid = 0; this.code = null; this.online = false; this.sources.clear(); this.snaps = []; this.hostOff = null; this.roster = [];
    try { sessionStorage.removeItem('hl_join'); sessionStorage.removeItem('hl_host'); } catch (e) { }
    if (G.world) for (const [pid] of [...G.world.players]) if (G.me && pid !== G.me.pid) G.world.players.delete(pid);
    if (G.me) { G.world.players.delete(G.me.pid); G.me.pid = 0; G.world.players.set(0, G.me); }
    updateNetStatus();
  },
  onServer(m) {
    switch (m.t) {
      case 'hosted':

        try { sessionStorage.setItem('hl_host', JSON.stringify({ code: m.code, token: m.token, url: this.url })); } catch (e) { }

        updateNetStatus(); break;

      case 'error':
        if (this._pending) { this._pending.rej(new Error(m.reason)); this._pending = null; } else toast(m.reason);
        break;

        this.roster = m.roster; chatSys(`${m.name} joined the party.`); SFX.play('chat'); updateNetStatus(); break;

//  Camera
// ---------------------------------------------------------------------------
function updateCamera(dt) {
  const w = G.world, me = G.me, cam = G.cam; if (!w || !me) return;
  let tx = me.x + Math.cos(me.aim) * 10, ty = me.y - 8 + Math.sin(me.aim) * 8;
  if (w.map.kind === 'dungeon') {
    const ri = roomIndexAt(w.map, me.x, me.y);
    // boss fights: frame both the hero and the boss
    let boss = w.dun && w.dun.bossId ? w.ents.get(w.dun.bossId) : null; if (!boss && w.dun) for (const e of w.ents.values()) if (e.boss) { boss = e; break; }

    if (ri >= 0) {
      const r = w.map.rooms[ri], x0 = (r.x0 - 1) * TS, x1 = (r.x1 + 2) * TS, y0 = (r.y0 - 2.5) * TS, y1 = (r.y1 + 2) * TS;

      ty = (y1 - y0 < R.H) ? (y0 + y1) / 2 : clamp(ty, y0 + R.H / 2, y1 - R.H / 2);

    tx = clamp(tx, R.W / 2, w.map.w * TS - R.W / 2); ty = clamp(ty, R.H / 2 - 30, w.map.h * TS - R.H / 2);

}

  for (const p of portalsOf(w)) if (inView(p.x, p.y, 60)) list.push({ y: p.y + 4, f: () => drawPortal(ctx, p) });
  if (w.npcs) for (const n of w.npcs) if (inView(n.x, n.y)) list.push({ y: n.y, f: () => drawNpc(ctx, n) });
  if (w.objects) for (const o of w.objects) if (inView(o.x, o.y, 60)) list.push({ y: o.y, f: () => { if (o.role === 'gate') drawGateSwirl(ctx, o); drawSpr(ctx, SPR[o.spr], 0, o.x, o.y); } });

  for (const l of w.loot) if (inView(l.x, l.y)) list.push({ y: l.y, f: () => drawLoot(ctx, l) });

      if (r.type === 'treasure' && vis) { ctx.fillStyle = '#f0b752'; ctx.fillRect(cx - 2, cy - 2, 5, 4); }

  for (const p of w.players.values()) { if (p.away) continue; ctx.fillStyle = p === G.me ? '#ffffff' : p.color; ctx.fillRect(ox + p.x / TS * s - 1.5, oy + p.y / TS * s - 1.5, 3, 3); }
  if (full) for (const pg of G.fx.pings) { ctx.fillStyle = pg.col; ctx.fillRect(ox + pg.x / TS * s - 2, oy + pg.y / TS * s - 2, 4, 4); }
}

    SFX.play('levelup'); banner('Level ' + P.level, '+2 stat points — press C to spend', '', 2.6);
    for (let i = 0; i < 40; i++) { const a = rnd(0, TAU); G.fx.parts.push(part(G.me.x + Math.cos(a) * rnd(4, 16), G.me.y - rnd(0, 20), 0, rnd(-60, -20), pick(['#ffd23f', '#fff2c0', '#46d6c8']), rnd(0.6, 1.2), 1, true)); }

function spawnLoot(x, y, o) {

function onEmote(d, from) {
  const w = G.world; const p = w && (from === Net.pid ? G.me : w.players.get(from)); if (!p) return;
  if (d.e === 'ping') { G.fx.pings.push({ x: d.x, y: d.y, t: 0, dur: 4, col: p.color || '#ffd23f', name: p.name }); SFX.play('ping', 0.7); }
  else { const txt = { help: 'HELP!', thanks: 'THANKS!', follow: 'FOLLOW ME' }[d.e] || '!'; p.emote = { text: txt, t: 3, col: d.e === 'help' ? '#ff6b5e' : '#7cf0a0' }; SFX.play('chat'); }
}

// ---------------------------------------------------------------------------
//  Interaction
// ---------------------------------------------------------------------------
function computeInteract() {
  const w = G.world, me = G.me; G.interact = null;
  if (!w || !me || me.dead || me.downed || G.menu) { $('prompt').classList.add('hidden'); return; }
  let best = null, bd = 1e9;
  const consider = (x, y, r, label, act, hgt) => { const d = dist(me.x, me.y, x, y); if (d < r && d < bd) { bd = d; best = { x, y, label, act, h: hgt }; } };
  if (G.scene === 'village') {
    for (const n of w.npcs) if (n.role !== 'villager') consider(n.x, n.y, 26, `Talk to ${n.name}`, () => openNpc(n), 32);
    for (const o of w.objects) consider(o.x, o.y + (o.role === 'gate' ? 18 : 0), o.role === 'gate' ? 34 : 26, o.role === 'gate' ? (Net.role === 'guest' ? 'Dungeon Gate (host chooses)' : 'Open the Dungeon Gate') : `Use ${o.name}`, () => openNpc(o), o.role === 'gate' ? 36 : 22);
    for (const n of w.npcs) if (n.role === 'villager') consider(n.x, n.y, 18, `Chat with ${n.name}`, () => { n.bubble = pick(['The Hearth burns warmer lately.', 'Careful in those crypts, dear.', 'Brann\'s been humming at the forge again.', 'Did you see the lights by the gate?', 'My cousin went into the grotto once. Once.', 'Bless you, hero.']); toast(`<b>${n.name}:</b> “${n.bubble}”`); }, 18);
  } else if (G.scene === 'dungeon') {
    for (const c of w.map.chests) if (!c.hidden && !c.opened) consider(c.x, c.y, 24, c.big ? 'Open the treasure chest' : 'Open chest', () => { const m = { k: 'interact', what: 'chest', i: c.i }; if (Net.isAuth()) hostInteract(w, m, Net.pid); else Net.send('host', m); }, 14);
    for (const p of portalsOf(w)) consider(p.x, p.y, 26, p.kind === 'boss' ? 'Return to Hearthlight (victory)' : (Net.role === 'guest' ? 'Exit portal (host leads)' : 'Leave the dungeon (keep your loot)'), () => { const m = { k: 'interact', what: 'portal', kind: p.kind }; if (Net.isAuth()) hostInteract(w, m, Net.pid); else Net.send('host', m); }, 22);
  }
  const pr = $('prompt');
  if (best) { G.interact = best; pr.innerHTML = `<b>E</b>${esc(best.label)}`; pr.classList.remove('hidden'); if (Input.take('interact')) best.act(); }
  else { pr.classList.add('hidden'); Input.take('interact'); }
}

// ---------------------------------------------------------------------------
//  Village ambience: townsfolk wander, NPCs face you
// ---------------------------------------------------------------------------
function updateVillage(w, dt) {
  for (const n of w.npcs) {
    if (n.role !== 'villager') { if (G.me) n.flip = G.me.x < n.x; continue; }
    if (n.wait > 0) { n.wait -= dt; n.walk = false; continue; }
    const d = dist(n.x, n.y, n.tx, n.ty);
    if (d < 2) { n.wait = rnd(2, 6); for (let k = 0; k < 10; k++) { const tx = n.x + rnd(-90, 90), ty = n.y + rnd(-70, 70); if (!solidAt(w.map, tx, ty) && tileAt(w.map, Math.floor(tx / TS), Math.floor(ty / TS)) !== T.TREE) { n.tx = tx; n.ty = ty; break; } } continue; }
    const a = angTo(n.x, n.y, n.tx, n.ty); n.walk = true; n.walkT += dt * 4; n.flip = Math.cos(a) < 0;
    const bx = n.x, by = n.y; moveEntity(w.map, n, Math.cos(a) * 26 * dt, Math.sin(a) * 26 * dt, 4);
    if (dist(bx, by, n.x, n.y) < 0.1) { n.tx = n.x; n.ty = n.y; }
  }
}
function separateEnemies(w) {
  const arr = []; for (const e of w.ents.values()) if (e.type === 'enemy' && !e.dead && !e.air && !e.hidden) arr.push(e);
  for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
    const a = arr[i], b = arr[j], d = dist(a.x, a.y, b.x, b.y), m = a.r + b.r;
    if (d < m && d > 0.01) { const push = (m - d) / 2, nx = (b.x - a.x) / d, ny = (b.y - a.y) / d, wa = b.mass / (a.mass + b.mass), wb = 1 - wa; a.x -= nx * push * wa * 2; a.y -= ny * push * wa * 2; b.x += nx * push * wb * 2; b.y += ny * push * wb * 2; }
  }
  // enemies gently push players apart from them (only our own avatar moves locally)
  const me = G.me; if (me && !me.dead && me.state !== 'roll') for (const e of arr) { const d = dist(e.x, e.y, me.x, me.y), m = e.r + me.r - 1; if (d < m && d > 0.01) { me.x += (me.x - e.x) / d * (m - d) * 0.5; me.y += (me.y - e.y) / d * (m - d) * 0.5; } }
}
function spikeCheck(w) {
  const me = G.me; if (!me || me.dead || me.downed || !w.map.spikes || !w.map.spikes.length) return;
  const tx = Math.floor(me.x / TS), ty = Math.floor(me.y / TS);
  if (tileAt(w.map, tx, ty) !== T.SPIKE) return;
  const s = w.map.spikes.find(s => s.tx === tx && s.ty === ty); if (!s || w.map.rooms[s.room].cleared) return;
  if (spikeState(s, hostTime(w)) === 2) { const res = hurtLocal(me, Math.round(9 + DUNGEONS[w.dun.did].level * 1.6), tx * TS + 8, ty * TS + 8, { kb: 60, unblockable: true }); if (res === true) sfxAt('spike', me.x, me.y); }
}
function discoverRooms(w) {
  const me = G.me; if (!me) return;
  const ri = roomIndexAt(w.map, me.x, me.y);
  if (ri >= 0 && !w.map.rooms[ri].discovered) w.map.rooms[ri].discovered = true;
}

// ---------------------------------------------------------------------------
//  Keys that open menus / chat / emotes
// ---------------------------------------------------------------------------
function onKeyCommand(e) {
  if (G.scene === 'title') { if (e.code === 'Escape' && G.menu) closeMenu(); return; }
  const k = e.code;
  if (k === 'Escape') { if (G.menu) closeMenu(); else openPause('game'); return; }
  if (k === 'Tab' || k === 'KeyI') { e.preventDefault(); if (G.menu === 'pause' && UI.pauseTab === 'inv') closeMenu(); else openPause('inv'); return; }
  if (k === 'KeyC') { if (G.menu === 'pause' && UI.pauseTab === 'char') closeMenu(); else openPause('char'); return; }
  if (k === 'KeyM') { if (G.menu === 'pause' && UI.pauseTab === 'map') closeMenu(); else openPause('map'); return; }
  if (k === 'KeyN') { SFX.settings.muted = !SFX.settings.muted; SFX.apply(); saveSettings(); toast(SFX.settings.muted ? 'Sound muted (N)' : 'Sound on'); return; }
  if (G.menu) return;
  if (k === 'Enter') { e.preventDefault(); openChat(); return; }
  if (k === 'KeyG') emote('ping');
  if (k === 'KeyH') emote('help');
  if (k === 'KeyT') emote('thanks');
}

// ---------------------------------------------------------------------------
//  Main loop: fixed 60 Hz simulation, render every frame
// ---------------------------------------------------------------------------
let _last = performance.now(), _acc = 0, _achT = 0;
function step(dt) {
  const w = G.world; if (!w) return;
  G.time += dt;
  if (Net.role === 'guest') guestInterpolate(w);
  interpolateRemotePlayers(w);
  if (G.me && G.scene !== 'title') updateLocalPlayer(G.me, w, dt);
  updatePlayerProjectiles(w, dt);
  if (Net.isAuth()) {
    w.time += dt;
    if (G.scene === 'dungeon') updateFlow(w, dt);
    for (const e of [...w.ents.values()]) { if (e.type === 'enemy') updateEnemy(w, e, dt); else updatePickup(w, e, dt); }
    if (G.scene === 'dungeon') { separateEnemies(w); updateRooms(w, dt); }
  } else if (G.scene === 'dungeon') separateEnemies(w);
  if (G.scene === 'dungeon') { updateHazards(w, dt); updateEProjs(w, dt); spikeCheck(w); discoverRooms(w); }
  updateLoot(w, dt);
  if (G.scene === 'village') updateVillage(w, dt);
  if (G.scene !== 'title') computeInteract();
  Net.tick(dt);
}
function tickSim(dt) {
  try { Input.pollPad(); } catch (e) { }
  let simDt = dt;
  if (Net.role === 'solo') {
    if (G.paused) simDt = 0;
    else if (G.hitstop > 0) { G.hitstop -= dt; simDt = 0; }
    else if (G.slowmo > 0) { G.slowmo -= dt; simDt *= 0.35; }
  } else { G.hitstop = 0; if (G.slowmo > 0) G.slowmo -= dt; }
  _acc += simDt; let n = 0;
  while (_acc >= TICK && n < 8) { step(TICK); _acc -= TICK; n++; }
  if (n >= 8) _acc = 0;
  if (G.P && G.scene !== 'title') { G.P.stats.playtime += dt; _achT += dt; if (_achT > 1) { _achT = 0; checkAchievements(); } }
}
let _frameErrT = 0;
function frame(t) {
  requestAnimationFrame(frame); // queue first: one bad frame must never stop the game loop
  try { frameBody(); } catch (e) { if (performance.now() - _frameErrT > 5000) { _frameErrT = performance.now(); console.error('frame error', e); } }
}
function frameBody() {
  const pn = performance.now(), dt = Math.min(0.1, Math.max(0, (pn - _last) / 1000)); _last = pn; _lastFrameAt = pn;
  G.rt += dt;
  tickSim(dt);
  if (G.scene === 'title') updateTitleCam(dt); else updateCamera(dt);
  updateFx(G.paused ? 0 : (Net.role === 'solo' && G.hitstop > 0 ? dt * 0.15 : dt));
  if (G.cine > 0) G.cine -= dt;
  if (!G.paused) ambientFx(dt);
  // mouse -> world
  Input.wx = Input.mx / R.S + G.cam.x - R.W / 2; Input.wy = Input.my / R.S + G.cam.y - R.H / 2;
  render();
  if (G.scene !== 'title') updateHUD(dt);
  if (G.scene === 'dungeon' && G.me && !G.me.dead && !G.me.downed && G.me.hp < G.me.maxHp * 0.3) { G._hb = (G._hb || 0) - dt; if (G._hb <= 0) { G._hb = 0.5 + 0.6 * G.me.hp / (G.me.maxHp * 0.3); SFX.play('heartbeat', 0.9); } }
}
// keep simulating (and networking) while the tab is hidden: rAF stops in background tabs
// Watchdog: browsers stop requestAnimationFrame for hidden or fully covered windows (sometimes
// without even flagging the page hidden). A Worker timer isn't throttled, so whenever frames
// stop arriving it keeps the fixed-step simulation and networking running.
let _lastFrameAt = performance.now();
function startBackgroundTicker() {
  const fallback = () => {
    const n = performance.now();
    if (n - _lastFrameAt < 120) return; // rAF is alive, nothing to do
    const dt = Math.min(0.1, (n - _last) / 1000); _last = n; tickSim(dt);
    updateFx(dt); // keep effects expiring so nothing piles up while hidden
  };
  try {
    const src = 'setInterval(()=>postMessage(0),20)';
    const wk = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    wk.onmessage = fallback;
  } catch (e) { setInterval(fallback, 20); }
}

// title backdrop: the village at night with a slow drifting camera
function setupTitleWorld() {
  const P = { flags: { clears: {} }, level: 1, stats: {} };
  const map = prerenderMap(genVillage(new Set(['merchant', 'houses', 'lanterns'])));
  const w = makeWorld('village', map); G.world = w;
  for (const n of VILLAGE_NPCS.slice(0, 3)) w.npcs.push({ ...n, x: n.x * TS, y: n.y * TS });
  for (const o of VILLAGE_OBJECTS) w.objects.push({ ...o, x: o.x * TS, y: o.y * TS });
  for (let i = 0; i < 4; i++) { const x = rnd(22, 38) * TS, y = rnd(20, 30) * TS; w.npcs.push({ id: 't' + i, name: '', spr: 'villager' + i, x, y, role: 'villager', walk: false, walkT: 0, tx: x, ty: y, wait: rnd(0, 3) }); }
  G.cam.x = 30 * TS; G.cam.y = 21 * TS;
}
function updateTitleCam(dt) {
  G.cam.x = 30 * TS - R.W * 0.2 + Math.sin(G.rt * 0.08) * 18; G.cam.y = 22.5 * TS + Math.sin(G.rt * 0.05) * 10;
  if (G.world) updateVillage(G.world, dt);
}

function boot() {
  loadSettings();
  Sprites.init();
  initRender();
  Input.init(R.cv);
  $('chatin').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); closeChat(true); } else if (e.key === 'Escape') { e.preventDefault(); closeChat(false); } e.stopPropagation(); });
  setupTitleWorld();
  showTitle();
  startBackgroundTicker();
  window.addEventListener('beforeunload', () => { saveGame(); });
  // first click anywhere starts audio (browsers block autoplay)
  const unlock = () => { SFX.init(); SFX.apply(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
  window.addEventListener('pointerdown', unlock); window.addEventListener('keydown', unlock);
  _last = performance.now(); requestAnimationFrame(frame);
  window.HL = { G, Net, SFX, Music }; // handy for debugging in the console
}
window.addEventListener('load', boot);

</script>
</body>
